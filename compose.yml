services:

  postgres:
    image: 'postgres:18.4'
    container_name: 'postgres'
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_DB=userdb'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  mailpit:
    image: 'axllent/mailpit:v1.31.0'
    container_name: 'mailpit'
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/livez"]
      interval: 3s
      timeout: 3s
      retries: 5