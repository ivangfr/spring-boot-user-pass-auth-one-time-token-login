services:

  postgres:
    image: 'postgres:18.0'
    container_name: 'postgres'
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_DB=userdb'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'

  mailpit:
    image: 'axllent/mailpit:v1.28.0'
    container_name: 'mailpit'
    ports:
      - '1025:1025'
      - '8025:8025'